name: CI

# Build + test the DGKN@Labs Crypto Suite on Windows.
# Verifies: compilation, full Catch2 suite, fuzz-stress, and binary mitigations.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      # Speed up the (intentionally slow) Argon2 KDF during tests only.
      DGKN_ARGON2_TEST_KIB: "64"

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (vcpkg manifest)
        shell: pwsh
        run: |
          # windows-latest ships vcpkg at C:\vcpkg. The manifest (vcpkg.json) pins versions.
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure (CMake + Ninja, Release, hardened)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          # Hinweis: Das GUI-Target (Qt6) wird übersprungen, wenn Qt nicht gefunden wird —
          # Core, CLI, Tests und Fuzzer bauen unabhängig davon.

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Run test suite (Catch2)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Fuzz-stress the parsers (50k random inputs)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          ./build/dgkn_fuzz.exe 50000

      - name: Verify binary mitigations (BinSkim)
        shell: pwsh
        continue-on-error: true   # informativ; bricht den Build nicht bei Tool-Problemen
        run: |
          dotnet tool install --global Microsoft.CodeAnalysis.BinSkim 2>$null
          binskim analyze build/dgkn_crypto.exe --rich-return-code || `
            Write-Host "BinSkim-Hinweis: siehe Ausgabe (ASLR/DEP/CFG/CET sind in CMake gesetzt)."
